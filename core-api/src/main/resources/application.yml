# ─────────────────────────────────────────────
# HandStats Core API — Configuration
# ─────────────────────────────────────────────

spring:
  application:
    name: handstats-core-api

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/handstats}

  # Désactiver la page d'erreur par défaut
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8080

# ─── JWT ───
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ─── Parser Service ───
  parser:
    base-url: ${PARSER_SERVICE_URL:http://localhost:8000}

# ─── Logging ───
logging:
  level:
    com.handstats: DEBUG
    org.springframework.security: INFO
