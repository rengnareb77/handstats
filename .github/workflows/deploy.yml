name: Build, Push and Deploy via Portainer

on:
  push:
    branches:
      - master

# Use environment variables for registry so it's easy to configure
env:
  # Base URL of your private registry, passed via secrets
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  # Image prefix (e.g., registry.example.com/handstats)
  IMAGE_PREFIX: ${{ secrets.REGISTRY_URL }}/handstats

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }} 
          
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Core API
        uses: docker/build-push-action@v5
        with:
          context: ./core-api
          file: ./core-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-core-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Parser Service
        uses: docker/build-push-action@v5
        with:
          context: ./parser-service
          file: ./parser-service/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-parser-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ssh:
    needs: build-and-push
    # S'exécute sur ton runner local Proxmox
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull origin master
            
            # Connexion au registry privé depuis le serveur
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            
            # Téléchargement des nouvelles images et redémarrage
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
