[project]
name = "handstats-parser-service"
version = "0.1.0"
description = "Microservice d'extraction de données depuis les FDME (PDF) pour HandStats+"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pdfplumber>=0.11.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
