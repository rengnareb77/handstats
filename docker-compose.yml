services:
  # ─────────────────────────────────────────────
  # Frontend PWA — Next.js (App Router)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - CORE_API_URL=http://core-api:8080/api
    depends_on:
      - core-api
    networks:
      - handstats-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ─────────────────────────────────────────────
  # Core API — Spring Boot (Java 21)
  # ─────────────────────────────────────────────
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/handstats
      - PARSER_SERVICE_URL=http://parser-service:8000
      - JWT_SECRET=change-me-in-production
    depends_on:
      - mongo
    networks:
      - handstats-network

  # ─────────────────────────────────────────────
  # Parser Service — FastAPI (Python)
  # ─────────────────────────────────────────────
  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - handstats-network

  # ─────────────────────────────────────────────
  # Database — MongoDB
  # ─────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - handstats-network

networks:
  handstats-network:
    driver: bridge

volumes:
  mongo-data:
